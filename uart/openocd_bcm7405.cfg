# OpenOCD конфиг для Humax CXHD-5150C (Broadcom BCM7405, MIPS32 BMIPS4380)
#
# ВАРИАНТ A — ESP8266 Wemos D1 mini как remote_bitbang мост по WiFi (рекомендуется сейчас):
#   1. Прошить uart/esp8266_remote_bitbang/esp8266_remote_bitbang.ino (вписать WiFi и пины).
#   2. Раскомментировать 3 строки ниже, вписать IP ESP (появится в Serial Monitor).
#
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 3335

# ВАРИАНТ B — FT232H (когда приедет): закомментировать вариант A, раскомментировать:
#
# adapter driver ftdi
# ftdi vid_pid 0x0403 0x6014 0x0403 0x6011   # FT232H и FT2232H
# ftdi channel 0
# ftdi layout_signal nSRST -oe 0x0020 -data 0x0020
# ftdi layout_signal nTRST -oe 0x0010 -data 0x0010

transport select jtag
adapter speed 100

# Сбросы управляем явно (ESP-прошивка сама держит TRST high)
reset_config none

# MIPS EJTAG TAP (irlen 5 — стандарт MIPS EJTAG v2.6+)
jtag newtap bcm7405 cpu -irlen 5

target create bcm7405.cpu mips_m4k -endian little -chain-position bcm7405.cpu

# BCM7405: kseg0 окно boot-flash и DRAM
#  DRAM    : 0x80000000 (128 МБ)
#  bootflash (XIP window): 0x1C000000 (NOR) — для NAND-бута CFE копируется в DRAM
bcm7405.cpu configure -work-area-phys 0x80020000 -work-area-size 0x8000 -work-area-backup 0

# Полезные команды после init:
#   jtag scan                        # проверить IDCODE (вписать потом в newtap)
#   bcm7405.cpu arp_examine
#   halt                             # остановить CPU
#   mdw 0x80000000 4                 # прочитать DRAM
#   dump_image cfe_dram.bin 0x80000000 0x40000   # CFE обычно копирует себя в начало DRAM
#   mdw 0xBFC00000 4                 # boot-вектор
