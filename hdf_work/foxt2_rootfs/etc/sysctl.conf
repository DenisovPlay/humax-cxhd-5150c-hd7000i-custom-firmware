#If enabled, provide RFC 2861 behavior and time out the congestion window after an idle period. An idle period is defined as the current RTO (retransmission timeout). If disabled, the congestion window will not be timed out after an idle period. Default is 1
net.ipv4.tcp_slow_start_after_idle = 0

#Enable RFC 1323 TCP window scaling. This feature allows the use of a large window (> 64K) on a TCP connection, should the other end support it. Normally, the 16 bit window length field in the TCP header limits the window size to less than 64K bytes. If larger windows are desired, applications can increase the size of their socket buffers and the window scaling option will be employed. If tcp_window_scaling is disabled, TCP will not negotiate the use of window scaling with the other end during connection setup. Default is 1
net.ipv4.tcp_window_scaling = 1

#contains the maximum socket receive buffer size in bytes which a user may set by using the SO_RCVBUF socket option. default 103424
net.core.rmem_max = 404480
#default is 103424
net.core.wmem_max = 404480
#contains the default setting in bytes of the socket receive buffer. default is 103424
net.core.rmem_default = 256960
#default is 103424
net.core.wmem_default = 256960

#Maximum length of ancillary data and user control data like the iovecs per socket. default is 10240
net.core.optmem_max = 10240

#This is a vector of 3 integers: [min, default, max]. These parameters are used by TCP to regulate receive buffer sizes. TCP dynamically adjusts the size of the receive buffer from the defaults listed below, in the range of these values, depending on memory available in the system. default is 4096 87380 262144
net.ipv4.tcp_rmem = 4096 87380 1572864
#default is 4096 16384 262144
net.ipv4.tcp_wmem = 4096 16384 524288

#This is a vector of 3 integers: [low, pressure, high]. These bounds, measured in units of the system page size, are used by TCP to track its memory usage. The defaults are calculated at boot time from the amount of available memory. (TCP can only use low memory for this, which is limited to around 900 megabytes on 32-bit systems. 64-bit systems do not suffer this limitation.) default is 6144 8192 12288
net.ipv4.tcp_mem = 21180 28242 42360

#Enable RFC 1323 TCP timestamps. default is 1.
net.ipv4.tcp_timestamps = 0

#Enable RFC 2018 TCP Selective Acknowledgements. default is 1.
net.ipv4.tcp_sack = 1

#This specifies how many seconds to wait for a final FIN packet before the socket is forcibly closed. This is strictly a violation of the TCP specification, but required to prevent denial-of-service attacks. default is 60
net.ipv4.tcp_fin_timeout = 30

#Allow to reuse TIME_WAIT sockets for new connections when it is safe from protocol viewpoint. It should not be changed without advice/request of technical experts. default is 0
net.ipv4.tcp_tw_reuse = 0

#Enable fast recycling of TIME_WAIT sockets. Enabling this option is not recommended since this causes problems when working with NAT (Network Address Translation). default is 0
net.ipv4.tcp_tw_recycle = 0

#The maximum number of TCP keep-alive probes to send before giving up and killing the connection if no response is obtained from the other end. default is 9
net.ipv4.tcp_keepalive_probes = 5

#The number of seconds between TCP keep-alive probes. default is 75
net.ipv4.tcp_keepalive_intvl = 30

#The maximum number of queued connection requests which have still not received an acknowledgement from the connecting client. If this number is exceeded, the kernel will begin dropping requests. The default value of 256 is increased to 1024 when the memory present in the system is adequate or greater (>= 128Mb), and reduced to 128 for those systems with very low memory (<= 32Mb). It is recommended that if this needs to be increased above 1024, TCP_SYNQ_HSIZE in include/net/tcp.h be modified to keep TCP_SYNQ_HSIZE*16<=tcp_max_syn_backlog, and the kernel be recompiled. default is 256
net.ipv4.tcp_max_syn_backlog = 256

#By default, TCP saves various connection metrics in the route cache when the connection closes, so that connections established in the near future can use these to set initial conditions. Usually, this increases overall performance, but it may sometimes cause performance degradation. If tcp_no_metrics_save is enabled, TCP will not cache metrics on closing connections. default is 0
net.ipv4.tcp_no_metrics_save = 0

#The number of seconds a connection needs to be idle before TCP begins sending out keep-alive probes. Keep-alives are only sent when the SO_KEEPALIVE socket option is enabled. The default value is 7200 seconds (2 hours). An idle connection is terminated after approximately an additional 11 minutes (9 probes an interval of 75 seconds apart) when keep-alive is enabled. Note that underlying connection tracking mechanisms and application timeouts may be much shorter. default is 7200
net.ipv4.tcp_keepalive_time = 1800

#The maximum number of orphaned (not attached to any user file handle) TCP sockets allowed in the system. When this number is exceeded, the orphaned connection is reset and a warning is printed. This limit exists only to prevent simple denial-of-service attacks. Lowering this limit is not recommended. Network conditions might require you to increase the number of orphans allowed, but note that each orphan can eat up to ~64K of unswappable memory. The default initial value is set equal to the kernel parameter NR_FILE. This initial default is adjusted depending on the memory in the system. default is 8192
net.ipv4.tcp_max_orphans = 8192

